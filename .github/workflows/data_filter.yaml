name: Data filter CI

on:
  pull_request:
    paths:
      - "data-filter/**"
      - ".github/workflows/data_filter.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    defaults:
      run:
        working-directory: data-filter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: data-filter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Run unit tests
        env:
          TZ: UTC
        run: npm test

  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data-filter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: data-filter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        env:
          TZ: UTC
        run: npm run test:e2e
